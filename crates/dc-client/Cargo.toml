[package]
name = "dc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dc-core.workspace = true
dc-api.workspace = true
dc-physics.workspace = true
# ROADMAP 3c-1: the real hierarchical worldgen backs the client's chunk seam
# (client may depend on headless crates; the reverse never happens).
dc-worldgen.workspace = true
# The registry-generated MCP tool layer is shared with the standalone dev
# server (registry_tools / envelope_for_tool_call) — see journal/0002.
dc-mcp-dev.workspace = true

bevy.workspace = true
fastnoise-lite.workspace = true
glam.workspace = true

# S4 (shader hook contract): shader packs are validated through the same naga
# the renderer's wgpu uses (version pinned to wgpu's via bevy 0.19 = 29.x).
naga = { version = "29", default-features = false, features = ["wgsl-in"] }
serde.workspace = true
toml = "0.9"

# In-client MCP server (client-through-dc-api milestone): rmcp streamable
# HTTP served by a minimal hyper accept loop on a dedicated tokio thread.
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Screenshot encoding: the same `image` bevy already links (0.25.x), used
# directly so save errors reach the MCP caller.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Runtime perf-observability (the "perf window" opener, journal/0080). OFF by
# default so normal play pays ZERO cost: the `perf_span!` macro expands to
# nothing and no aggregating layer is installed. When enabled it turns on bevy's
# own `trace` spans (systems/render) alongside our custom hot-path spans, and
# installs the self-time aggregating subscriber + the `--perf-drop` capture mode.
# No extra crates are pulled: the layer uses bevy's re-exported `tracing` /
# `tracing_subscriber`, so there is no version-split risk with LogPlugin.
perf = ["bevy/trace"]

[dev-dependencies]
# The S4 cross-backend portability test additionally translates every pack
# entry point to HLSL/SPIR-V/MSL (docs/rendering/PIPELINE.md § Portability).
naga = { version = "29", default-features = false, features = [
    "wgsl-in",
    "hlsl-out",
    "spv-out",
    "msl-out",
] }
# The MCP-over-HTTP session test drives the real streamable-HTTP service with
# hand-built http requests (the S5 duplex-pipe pattern, one transport on).
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
