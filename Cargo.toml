[workspace]
resolver = "3"
members = [
    "crates/dc-core",
    "crates/dc-sim",
    "crates/dc-worldgen",
    "crates/dc-api",
    "crates/dc-host",
    "crates/dc-mcp-dev",
    "crates/dc-physics",
    "crates/dc-client",
]
# The demo plugin is built for wasm32-unknown-unknown by a separate cargo
# invocation (see crates/dc-host/tests). It is excluded so that host-target
# workspace builds (test/clippy --all-targets) do not try to link a cdylib
# with unresolved wasm imports.
exclude = ["plugins/demo-builder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dc-core = { path = "crates/dc-core" }
dc-sim = { path = "crates/dc-sim" }
dc-worldgen = { path = "crates/dc-worldgen" }
dc-api = { path = "crates/dc-api" }
dc-host = { path = "crates/dc-host" }
dc-mcp-dev = { path = "crates/dc-mcp-dev" }
dc-physics = { path = "crates/dc-physics" }

glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Added by S3: compact serde wire format for the chunk container (format v1).
# S5 reuses it as the WASM-boundary envelope encoding.
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Pinned exact by S1 (see docs/spikes/S1-results.md for the version rationale).
bevy = "=0.19.0"
fastnoise-lite = "1.1.1"

# Pinned exact by S5 (plugin host + MCP over one surface).
wasmtime = "=46.0.1"
rmcp = "=2.2.0"
tokio = "1.53"

# Client-through-dc-api milestone: the in-client MCP server speaks rmcp's
# streamable HTTP transport (a tower service); hyper/hyper-util are the
# minimal HTTP/1.1 server loop that drives it (axum would add a router we
# don't need). http/http-body-util/bytes are already in rmcp's transport
# dependency tree; listed here for the in-process session tests.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http = "1"
http-body-util = "0.1"
bytes = "1"

# Pinned exact by S6 (physics bubble). Direct rapier3d, not bevy_rapier: we own
# the stepping loop, the collider-bubble lifecycle, and the voxel-world
# coupling; a Bevy plugin layer would own exactly the parts we need to own
# (see docs/spikes/S6-results.md for the full rationale).
# `enhanced-determinism` trades SIMD for cross-platform reproducibility.
rapier3d = { version = "=0.34.0", default-features = false, features = [
    "dim3",
    "f32",
    "std",
    "enhanced-determinism",
] }

[profile.dev]
# Voxel meshing/worldgen is unusable at opt-level 0; keep our code debuggable
# but dependencies optimized.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
